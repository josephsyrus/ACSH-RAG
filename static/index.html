<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ACSH-RAG</title>
<style>
  :root {
    --bg: #16161a; --panel: #1f1f27; --border: #2e2e3a;
    --text: #e8e8ef; --muted: #9a9aad; --accent: #6c5ce7;
    --green: #1f7a5c; --red: #a03c3c; --amber: #8a6d1f;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: var(--bg); color: var(--text);
    font-family: "Segoe UI", system-ui, sans-serif;
    display: flex; flex-direction: column; height: 100vh;
  }
  header {
    padding: 14px 22px; border-bottom: 1px solid var(--border);
    display: flex; align-items: baseline; gap: 12px;
  }
  header h1 { font-size: 18px; }
  header span { color: var(--muted); font-size: 13px; }
  #chat { flex: 1; overflow-y: auto; padding: 22px; display: flex; flex-direction: column; gap: 14px; }
  .msg { max-width: 76%; padding: 12px 16px; border-radius: 12px; line-height: 1.5; white-space: pre-wrap; word-wrap: break-word; }
  .user { align-self: flex-end; background: var(--accent); border-bottom-right-radius: 4px; }
  .bot  { align-self: flex-start; background: var(--panel); border: 1px solid var(--border); border-bottom-left-radius: 4px; }
  .meta { display: flex; gap: 8px; margin-top: 10px; flex-wrap: wrap; }
  .chip { font-size: 11px; padding: 3px 9px; border-radius: 99px; border: 1px solid var(--border); color: var(--muted); }
  .chip.pass { border-color: var(--green); color: #6fcf9f; }
  .chip.low_confidence, .chip.quota_exhausted { border-color: var(--amber); color: #e2c56b; }
  .chip.refused, .chip.error { border-color: var(--red); color: #e07b7b; }
  .cites { margin-top: 8px; font-size: 12px; color: var(--muted); }
  .cites code { background: var(--bg); padding: 2px 6px; border-radius: 4px; }
  form { display: flex; gap: 10px; padding: 16px 22px; border-top: 1px solid var(--border); }
  input {
    flex: 1; padding: 12px 16px; border-radius: 10px; border: 1px solid var(--border);
    background: var(--panel); color: var(--text); font-size: 15px; outline: none;
  }
  input:focus { border-color: var(--accent); }
  button {
    padding: 12px 22px; border-radius: 10px; border: none; background: var(--accent);
    color: white; font-size: 15px; cursor: pointer;
  }
  button:disabled { opacity: 0.5; cursor: wait; }
  .typing { color: var(--muted); font-style: italic; }
  #srcbar { display: flex; align-items: center; gap: 12px; padding: 10px 22px; border-bottom: 1px solid var(--border); background: var(--panel); font-size: 13px; }
  #uploadBtn { cursor: pointer; padding: 6px 12px; border: 1px solid var(--accent); border-radius: 8px; color: #cfc9ff; white-space: nowrap; }
  #uploadBtn:hover { background: rgba(108,92,231,0.15); }
  #srcStatus { color: var(--muted); }
  .msg p { margin: 0 0 8px; white-space: normal; }
  .msg p:last-child { margin-bottom: 0; }
  .msg ul { margin: 6px 0 6px 0; padding-left: 22px; white-space: normal; }
  .msg li { margin: 3px 0; white-space: normal; }
  .msg strong { color: #fff; }
  .msg code { background: var(--bg); padding: 1px 5px; border-radius: 4px; font-size: 0.92em; }
  .loader { display: inline-flex; gap: 4px; margin-right: 9px; vertical-align: middle; }
  .loader span { width: 7px; height: 7px; border-radius: 50%; background: var(--accent); animation: bounce 1.2s infinite ease-in-out; }
  .loader span:nth-child(2) { animation-delay: .2s; }
  .loader span:nth-child(3) { animation-delay: .4s; }
  @keyframes bounce { 0%, 80%, 100% { transform: scale(.5); opacity: .5; } 40% { transform: scale(1); opacity: 1; } }
  .loadtxt { color: var(--muted); font-style: italic; font-size: 13px; vertical-align: middle; }
</style>
</head>
<body>
<header>
  <h1>ACSH-RAG</h1>
  <span>hybrid retrieval &middot; adaptive routing &middot; cited answers</span>
</header>

<div id="srcbar">
  <label id="uploadBtn">
    &#128196; Upload a document
    <input id="fileInput" type="file" accept=".pdf,.md,.markdown,.txt" hidden>
  </label>
  <span id="srcStatus">Using the default corpus. Upload a PDF/text file to ask about your own document.</span>
</div>

<div id="chat">
  <div class="msg bot">Ask me anything about the ingested documents. Every answer is grounded in the sources and cited &mdash; if the documents don't cover it, I'll say so.</div>
</div>

<form id="form">
  <input id="q" type="text" placeholder="Ask a question..." autocomplete="off" autofocus>
  <button id="send" type="submit">Ask</button>
</form>

<script>
const chat = document.getElementById("chat");
const form = document.getElementById("form");
const input = document.getElementById("q");
const send = document.getElementById("send");
const fileInput = document.getElementById("fileInput");
const srcStatus = document.getElementById("srcStatus");
let sessionId = null;

function add(cls, html) {
  const d = document.createElement("div");
  d.className = "msg " + cls;
  d.innerHTML = html;
  chat.appendChild(d);
  chat.scrollTop = chat.scrollHeight;
  return d;
}
const esc = s => s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");

// Minimal, safe Markdown → HTML (escapes first, then renders bold, inline code,
// and nested bullet lists — the shapes the LLM actually produces).
function renderMarkdown(md) {
  const inline = s => esc(s)
    .replace(/\*\*(.+?)\*\*/g, "<strong>$1</strong>")
    .replace(/`([^`]+?)`/g, "<code>$1</code>");
  const lines = (md || "").replace(/\r\n/g, "\n").split("\n");
  const out = [], stack = [];
  let para = [];
  const flushP = () => { if (para.length) { out.push("<p>" + para.map(inline).join("<br>") + "</p>"); para = []; } };
  const closeAll = () => { while (stack.length) { out.push("</ul>"); stack.pop(); } };
  for (const raw of lines) {
    const m = raw.match(/^(\s*)[*\-]\s+(.*)$/);
    if (m) {
      flushP();
      const ind = m[1].length;
      while (stack.length && stack[stack.length - 1] > ind) { out.push("</ul>"); stack.pop(); }
      if (!stack.length || stack[stack.length - 1] < ind) { out.push("<ul>"); stack.push(ind); }
      out.push("<li>" + inline(m[2]) + "</li>");
    } else if (raw.trim() === "") {
      flushP();
    } else {
      closeAll(); para.push(raw.trim());
    }
  }
  flushP(); closeAll();
  return out.join("");
}

form.addEventListener("submit", async (e) => {
  e.preventDefault();
  const q = input.value.trim();
  if (!q) return;
  add("user", esc(q));
  input.value = "";
  send.disabled = true;
  const wait = add("bot", '<span class="loader"><span></span><span></span><span></span></span><span class="loadtxt">thinking… 0s</span>');
  const t0 = Date.now();
  let stageMsg = "thinking…";
  const paint = () => {
    const el = wait.querySelector(".loadtxt");
    if (el) el.textContent = stageMsg + " · " + Math.round((Date.now() - t0) / 1000) + "s";
  };
  const timer = setInterval(paint, 1000);

  const renderDone = (evt) => {
    let html = renderMarkdown(evt.answer);
    html += `<div class="meta">
      <span class="chip">route: ${esc(evt.route)}</span>
      <span class="chip ${esc(evt.confidence)}">confidence: ${esc(evt.confidence)}</span>
    </div>`;
    if (evt.citations && evt.citations.length) {
      const src = evt.citations.map(c => {
        const file = esc(c.filename || c.chunk_id || "source");
        const label = c.page ? `${file} — p.${esc(String(c.page))}` : file;
        return `<code>${label}</code>`;
      }).join(" ");
      html += `<div class="cites">sources: ${src}</div>`;
    }
    wait.className = "msg bot";
    wait.innerHTML = html;
  };

  try {
    const res = await fetch("/api/ask_stream", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ question: q, session_id: sessionId }),
    });
    if (!res.ok || !res.body) {
      let detail = res.statusText;
      try { detail = (await res.json()).detail || detail; } catch (_) {}
      throw new Error(detail);
    }
    const reader = res.body.getReader();
    const decoder = new TextDecoder();
    let buf = "", finished = false;
    while (true) {
      const { done, value } = await reader.read();
      if (done) break;
      buf += decoder.decode(value, { stream: true });
      let idx;
      while ((idx = buf.indexOf("\n\n")) >= 0) {
        const frame = buf.slice(0, idx).trim();
        buf = buf.slice(idx + 2);
        if (!frame.startsWith("data:")) continue;
        let evt;
        try { evt = JSON.parse(frame.slice(5).trim()); } catch (_) { continue; }
        if (evt.type === "stage") { stageMsg = evt.label; paint(); }
        else if (evt.type === "done") { finished = true; renderDone(evt); }
        else if (evt.type === "error") {
          finished = true;
          wait.className = "msg bot";
          wait.innerHTML = `<span class="chip error">error</span> ${esc(evt.detail)}`;
        }
      }
      chat.scrollTop = chat.scrollHeight;
    }
    if (!finished) {
      wait.className = "msg bot";
      wait.innerHTML = `<span class="chip error">error</span> the response stream ended unexpectedly.`;
    }
  } catch (err) {
    wait.className = "msg bot";
    wait.innerHTML = `<span class="chip error">error</span> ${esc(err.message)}`;
  } finally {
    clearInterval(timer);
    send.disabled = false;
    input.focus();
    chat.scrollTop = chat.scrollHeight;
  }
});

fileInput.addEventListener("change", async () => {
  const f = fileInput.files[0];
  if (!f) return;
  srcStatus.textContent = `Uploading & indexing "${f.name}"… (local, ~10-30s)`;
  const fd = new FormData();
  fd.append("file", f);
  try {
    const res = await fetch("/api/upload", { method: "POST", body: fd });
    const data = await res.json();
    if (!res.ok) throw new Error(data.detail || res.statusText);
    sessionId = data.session_id;
    srcStatus.innerHTML = `&#128196; Answering from <strong>${esc(data.filename)}</strong> — ${data.chunks} chunks${data.pages ? `, ${data.pages} pages` : ""}.`;
    add("bot", `Indexed <strong>${esc(data.filename)}</strong>. Ask me anything about it.`);
  } catch (err) {
    srcStatus.textContent = "Upload failed: " + esc(err.message);
    add("bot", `<span class="chip error">upload error</span> ${esc(err.message)}`);
  } finally {
    fileInput.value = "";
  }
});
</script>
</body>
</html>
