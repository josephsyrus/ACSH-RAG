name: ACSH-RAG Evaluation

# Every push and pull request runs the free retrieval check (no API key, no cost).
# The full RAGAS evaluation calls the Gemini API, so it only runs when started by
# hand: Actions -> ACSH-RAG Evaluation -> Run workflow -> tick "full".
on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      full:
        description: "Also run the full RAGAS evaluation (uses the Gemini API)"
        type: boolean
        default: false

# The evaluation documents are not committed. Store them as a base64 zip in the
# EVAL_CORPUS_ZIP_B64 secret, containing gnn_leak_detection.pdf (kept as text) and
# fuzzy_gnn_source.pdf (turned into an image-only "scanned" copy):
#   zip corpus.zip gnn_leak_detection.pdf fuzzy_gnn_source.pdf && base64 -w0 corpus.zip

jobs:
  retrieval-check:
    name: Retrieval check (every change)
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements_b.txt "pandas>=2.2"
          python -m spacy download en_core_web_sm

      - name: Cache embedding and reranking models
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-models-v1

      - name: Restore evaluation documents
        id: corpus
        env:
          EVAL_CORPUS_ZIP_B64: ${{ secrets.EVAL_CORPUS_ZIP_B64 }}
        run: |
          if [ -z "$EVAL_CORPUS_ZIP_B64" ]; then
            echo "::warning::EVAL_CORPUS_ZIP_B64 is not set, so the evaluation was skipped."
            echo "ready=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          mkdir -p eval_src
          echo "$EVAL_CORPUS_ZIP_B64" | base64 -d > eval_src/corpus.zip
          unzip -o eval_src/corpus.zip -d eval_src
          echo "ready=true" >> "$GITHUB_OUTPUT"

      - name: Build evaluation index (includes OCR of the scanned copy)
        if: steps.corpus.outputs.ready == 'true'
        run: >
          python evaluation/prepare_corpus.py
          --text eval_src/gnn_leak_detection.pdf
          --scanned eval_src/fuzzy_gnn_source.pdf=fuzzy_gnn_scanned.pdf

      - name: Retrieval check
        if: steps.corpus.outputs.ready == 'true'
        run: python evaluation/eval.py --retrieval-only

      - name: Write summary
        if: always() && steps.corpus.outputs.ready == 'true'
        run: python evaluation/summary.py >> "$GITHUB_STEP_SUMMARY"

      - name: Upload results and dashboard
        if: always() && steps.corpus.outputs.ready == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: retrieval-check-${{ github.run_id }}
          path: evaluation/results/
          retention-days: 30

  ragas:
    name: Full RAGAS evaluation (manual)
    if: github.event_name == 'workflow_dispatch' && inputs.full
    needs: retrieval-check
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements_b.txt -r requirements_c.txt
          python -m spacy download en_core_web_sm

      - name: Cache embedding and reranking models
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-models-v1

      - name: Restore evaluation documents
        env:
          EVAL_CORPUS_ZIP_B64: ${{ secrets.EVAL_CORPUS_ZIP_B64 }}
        run: |
          mkdir -p eval_src
          echo "$EVAL_CORPUS_ZIP_B64" | base64 -d > eval_src/corpus.zip
          unzip -o eval_src/corpus.zip -d eval_src

      - name: Build evaluation index
        run: >
          python evaluation/prepare_corpus.py
          --text eval_src/gnn_leak_detection.pdf
          --scanned eval_src/fuzzy_gnn_source.pdf=fuzzy_gnn_scanned.pdf

      - name: RAGAS evaluation
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python evaluation/eval.py --ci --pause 10

      - name: Write summary
        if: always()
        run: python evaluation/summary.py >> "$GITHUB_STEP_SUMMARY"

      - name: Upload results and dashboard
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ragas-${{ github.run_id }}
          path: evaluation/results/
          retention-days: 30
