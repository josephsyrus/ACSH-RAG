# ACSH-RAG evaluation settings (used by evaluation/eval.py).
# A run passes only when every metric it measured meets its threshold.
# These thresholds are starting points: raise them as the system improves.

judge_model: "gemini-3.1-flash-lite"           # LLM that grades the answers
embedding_model: "models/gemini-embedding-001" # used by answer relevancy
max_workers: 4        # parallel judge calls; keep low to stay under API rate limits
ci_sample_size: 12    # questions used by `--ci`

metrics:
  # ── free: computed without any API call ───────────────────────────────────────
  retrieval_hit_rate:
    threshold: 0.80
    description: "Share of answerable questions where a passage containing the answer reached the answer step."
  # ── pipeline behaviour ────────────────────────────────────────────────────────
  answer_rate:
    threshold: 0.85
    description: "Share of answerable questions the system answered instead of refusing."
  refusal_accuracy:
    threshold: 0.75
    description: "Share of questions the documents cannot answer that the system correctly refused."
  # ── RAGAS (graded by the judge model) ─────────────────────────────────────────
  faithfulness:
    threshold: 0.70
    description: "Are the answer's claims supported by the passages it was written from? Catches hallucination."
  answer_relevancy:
    threshold: 0.70
    description: "Does the answer address the question that was asked?"
  context_recall:
    threshold: 0.65
    description: "Do the retrieved passages contain the facts in the reference answer?"
  factual_correctness:
    threshold: 0.60
    description: "Share of the reference answer's facts that the answer states correctly."
